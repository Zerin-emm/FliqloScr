plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fliqlo.clock'
    compileSdk 36

    // APK 文件名（产物为 Fliqlo-debug.apk / Fliqlo-release.apk）
    base {
        archivesName = 'Fliqlo'
    }

    defaultConfig {
        applicationId 'com.fliqlo.clock'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    // 签名密钥随仓库分发（android/fliqlo.keystore）。
    // 这是自用侧载 App：密钥入库让任何机器 / CI 构建出的包签名一致，
    // 才能覆盖更新。密钥与密码公开的风险是他人可签出同签名更新包——
    // 只要只从自己的 Release 页下载 APK，该风险不成立。
    signingConfigs {
        release {
            storeFile rootProject.file('fliqlo.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 页面是单文件、无外部请求，不需要任何依赖
}

dependencies {
}
