body.secs-on.dummy #main-content,body.secs-on.portrait:not(.dummy) #main-content{margin-left:-350px!important;margin-top:-975px!important;width:700px!important;height:1950px!important}

</style></head><body><div id="loader"></div><div id="main"><div id="main-content"><div id="main-content-area"><div class="flips" id="hurs"><div class="flip hur top"></div><div class="flip bottom hur"></div></div><div class="flips" id="mins"><div class="flip min top"></div><div class="flip bottom min"></div></div><div class="flips" id="secs"><div class="flip sec top"></div><div class="flip bottom sec"></div></div></div></div></div><script>
/* ===== seconds card driver + "+S" entries in the hour-format select ===== */
(function(){
  var KEY="ss", enabled=true, started=false, snapFn=null;
  var LABELS=["1-12 AM/PM","00-23","0-23","1-12 AM/PM +S","00-23 +S","0-23 +S"];

  try{ var saved=localStorage.getItem(KEY); if(saved!==null){ enabled = saved==="1" } }catch(e){}
  var q=/[?&]ss=([01])/.exec(window.location.search);
  if(q){ enabled = q[1]==="1" }

  if(document.body){ document.body.classList.toggle("secs-on", enabled) }

  function persist(){
    try{ localStorage.setItem(KEY, enabled?"1":"0") }catch(e){}
  }
  function setEnabled(on,save){
    enabled=!!on;
    document.body.classList.toggle("secs-on", enabled);
    if(save){ persist() }
    if(snapFn){ snapFn() }
    window.dispatchEvent(new CustomEvent("_resize"));
  }
  function baseTf(){
    var v=parseInt(window.tf,10);
    if(isNaN(v)){ v=0 }
    return ((v%3)+3)%3;
  }
  function selectedValue(){ return baseTf() + (enabled?3:0) }

  function buildSelect(){
    var old=document.getElementById("tf");
    if(!old){ return null }
    if(old.getAttribute("data-extended")==="1"){ return old }
    var ns=document.createElement("select");
    ns.id="tf";
    ns.tabIndex=-1;
    ns.setAttribute("data-extended","1");
    for(var i=0;i<6;i++){
      var o=document.createElement("option");
      o.value=String(i);
      o.innerHTML="&nbsp;"+LABELS[i]+"&nbsp;";
      ns.appendChild(o);
    }
    old.parentNode.replaceChild(ns,old);
    ns.addEventListener("change",function(){
      var v=parseInt(ns.value,10);
      if(isNaN(v)){ v=0 }
      var base=v%3, sec=v>=3;
      setEnabled(sec,true);
      if(String(base)!==String(baseTf()) && typeof window.updateSettings==="function"){
        window.updateSettings({tf:String(base)});
        window.dsptf=null;
      }
      ns.value=String(base+(enabled?3:0));
      var cont=document.getElementById("tf-container");
      if(cont){ cont.dispatchEvent(new CustomEvent("_change")) }
    });
    ns.addEventListener("keyup",function(e){
      if(e.keyCode===27 || e.keyCode===13){ ns.blur() }
    });
    return ns;
  }

  function syncSelect(){
    var sel=document.getElementById("tf");
    if(sel && sel.getAttribute("data-extended")==="1"){
      sel.value=String(selectedValue());
    }
  }

  function initDriver(){
    var top=document.getElementById("sec-top-org"),
        bot=document.getElementById("sec-bottom-org"),
        topc=document.getElementById("sec-top-clone"),
        botc=document.getElementById("sec-bottom-clone");
    if(!top||!bot||!topc||!botc){ return false }
    started=true;
    var area=document.getElementById("main-content-area"),
        last=null, lock=false, lockAt=0, STEP=175;

    function pad(n){ return n<10?"0"+n:""+n }
    function clear(el){ el.classList.remove("act","transform","fadein","fadeout1","fadeout2") }
    function paint(el,n){
      var sp=el.getElementsByTagName("span")[0];
      if(sp){ sp.textContent=pad(n) }
      el.classList.toggle("eleven", n%10===1);
      el.classList.toggle("justeleven", n===11);
    }
    function snap(){
      clear(top); clear(bot); clear(topc); clear(botc);
      var s=new Date().getSeconds();
      paint(top,s); paint(bot,s); paint(topc,s); paint(botc,s);
      last=s; lock=false;
    }
    function flip(s){
      if(area){ area.classList.remove("stop") }
      var prev=last;
      last=s; lock=true; lockAt=Date.now();
      paint(topc,prev);
      topc.classList.add("act","transform");
      paint(top,s);
      top.classList.remove("fadein"); void top.offsetWidth; top.classList.add("fadein");
      paint(botc,s);
      bot.classList.add("fadeout1");
      setTimeout(function(){
        topc.classList.remove("act","transform");
        paint(topc,s);
        botc.classList.add("act","transform");
        setTimeout(function(){
          botc.classList.remove("act","transform");
          paint(bot,s);
          bot.classList.remove("fadeout1","fadeout2");
          lock=false;
        },STEP);
      },STEP);
    }

    snapFn=snap;
    document.addEventListener("visibilitychange",function(){ if(!document.hidden){ snap() } });
    snap();
    setInterval(function(){
      var s=new Date().getSeconds();
      if(!enabled){ last=s; return }
      if(lock && Date.now()-lockAt>1500){ lock=false }
      if(lock || s===last){ return }
      flip(s);
    },150);
    return true;
  }

  var tries=0;
  function boot(){
    var settings=document.getElementById("settings");
    if(settings){
      buildSelect();
      syncSelect();
    }
    if(initDriver()){
      syncSelect();
      setTimeout(syncSelect,300);
      return;
    }
    if(++tries<120){ setTimeout(boot,50) }
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",function(){ setTimeout(boot,0) });
  }else{
    setTimeout(boot,0);
  }
  window.addEventListener("load",function(){ setTimeout(syncSelect,0) });
})();
</script></body></html>
